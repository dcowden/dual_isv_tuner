[platformio]
default_envs = esp32debug

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; Conservative flashing settings for classic ESP32-WROOM development boards.
upload_speed = 115200
board_build.flash_mode = dio
monitor_speed = 38400
monitor_dtr = 0
monitor_rts = 0

; Keep application debug logs out of the binary servo protocol.
build_flags = -DCORE_DEBUG_LEVEL=0

; Uncomment and change these if automatic port detection picks the wrong port.
; upload_port = COM5
; monitor_port = COM5

; Default build: passive browser diagnostics over a separate Wi-Fi connection.
; Use -e esp32dev to build/upload without Wi-Fi diagnostics.
[env:esp32debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_WIFI_DIAGNOSTICS=1
